    <script>
        // 菜单按钮
        const btn = document.getElementById('menuBtn');
        const menu = document.getElementById('menu');
        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            if (menu.classList.contains('hidden')) {
                btn.className = 'fa fa-bars text-3xl mr-2';
            } else {
                btn.className = 'fa fa-times text-3xl mr-2';
            }
        });
        // 回到顶部
        window.onscroll = () => {
            let b = document.getElementById("back-to-top");
            if (b) {
                b.classList.toggle("opacity-0", window.scrollY < 99);
                b.classList.toggle("opacity-100", window.scrollY >= 99);
            }
        };
        // 滚动文字动画
        const animateElements = document.querySelectorAll('.animate-fade-in');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });
        animateElements.forEach(el => observer.observe(el));
    </script>
