    <script>
        /* 版权年份自动更新 */
        document.getElementById('copyrightText').innerText = `Copyright © vbn262.com 版权所有 2025‑${new Date().getFullYear()}`;
        /* 全屏加载遮罩 */
        const mask = document.getElementById('loading-mask'),
            cover = document.getElementById('cover'),
            pctEl = document.getElementById('pct');
        const DUR = 4000;
        cover.style.setProperty('--t', DUR + 'ms');
        let done = 0, started = false, start = 0, raf = 0, closed = false;
        const easeOut = t => 1 - Math.pow(1 - t, 2.2);
        function tick(now) {
            if (closed) return;
            const t = Math.min(1, (now - start) / DUR);
            pctEl.textContent = Math.round(easeOut(t) * 100);
            t < 1 ? raf = requestAnimationFrame(tick) : pctEl.textContent = '100';
        }
        function startPlay() {
            if (started) return;
            started = true;
            cover.classList.add('play');
            start = performance.now();
            raf = requestAnimationFrame(tick);
        }
        function onOne() { if (++done >= 2) startPlay(); }
        const i1 = new Image(), i2 = new Image();
        i1.onload = i1.onerror = onOne; i1.src = 'https://vbn262.com/00.jpg';
        i2.onload = i2.onerror = onOne; i2.src = 'https://vbn262.com/3.jpg';
        window.addEventListener('load', startPlay, { once: true });
        cover.addEventListener('animationend', () => {
            cancelAnimationFrame(raf);
            pctEl.textContent = '100';
            setTimeout(() => {
                if (closed) return;
                closed = true;
                mask.classList.add('fade-out');
                setTimeout(() => mask.remove(), 700);
            }, 2500);
        }, { once: true });
    </script>
