        const updateTime = () => {

            document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('date').textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
            document.getElementById('weekday').textContent = weekdays[now.getDay()];
        };
        updateTime();
        setInterval(updateTime, 1000);

        document.querySelectorAll('.download-btn').forEach(btn => {
            btn.addEventListener('click', e => {
                e.preventDefault();
                alert('谨防上当！');
            })
        });

        window.addEventListener('scroll', () => {
            const backTop = document.getElementById("back-to-top");
            if (!backTop) return;
            const showBtn = window.scrollY > 99;
            if (showBtn) {
                backTop.classList.remove('opacity-0', 'invisible');
                backTop.classList.add('opacity-100');
            } else {
                backTop.classList.add('opacity-0', 'invisible');
                backTop.classList.remove('opacity-100');
            }
        });
